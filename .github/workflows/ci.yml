name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.1
          sha256: 961b1fcc78830e861ab887abd19d9b961478bcf252e37881fdd61c81388308d4
          install: false
          cache: true

      - name: Install locked tools
        run: mise install --locked

      - name: Bootstrap the workspace
        run: mise run bootstrap

      - name: Run repository checks
        run: mise run check

      - name: Validate the fictional deployment bundle
        run: mise run deploy-dry-run
