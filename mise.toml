[settings]
lockfile = true

[tools]
node = "24.18.1"
"npm:pnpm" = "11.20.0"

[tasks.bootstrap]
description = "Install locked dependencies and generate Worker binding types"
run = ["pnpm install --frozen-lockfile", "pnpm run types"]

[tasks.check]
description = "Run all static checks and tests"
run = "pnpm check"

[tasks.dev]
description = "Start the local Worker development server"
run = "pnpm dev"

[tasks.smoke]
description = "Apply local migrations and run the Worker smoke test"
run = "pnpm smoke"

[tasks.deploy-dry-run]
description = "Validate staging and production deployments without publishing them"
run = "pnpm deploy:dry-run"

[tasks.deploy]
description = "Deploy the production Worker and apply production D1 migrations"
run = "pnpm deploy"

[tasks.deploy-staging]
description = "Deploy the staging Worker and apply staging D1 migrations"
run = "pnpm deploy:staging"

[tasks.deploy-production]
description = "Deploy the production Worker and apply production D1 migrations"
run = "pnpm deploy:production"
